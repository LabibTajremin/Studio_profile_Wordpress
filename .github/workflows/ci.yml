name: CI

on:
  push:
    branches: [ main, 'claude/**' ]
  pull_request:

jobs:
  lint-and-static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer
      - run: composer install --no-progress --prefer-dist
      - run: composer lint
      - run: composer analyse

  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer
      - run: composer install --no-progress --prefer-dist
      - run: composer test:unit

  integration-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: wordpress_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer
      - run: composer install --no-progress --prefer-dist
      - name: Install WP test suite
        # No apt step ahead of this any more: the installer fetches the
        # suite over HTTPS rather than Subversion. The step timeout is a
        # backstop — a network fetch that stalls should fail the job in
        # minutes, not sit there for hours.
        timeout-minutes: 10
        run: |
          bash bin/install-wp-tests.sh wordpress_test root '' 127.0.0.1:3306 latest
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
      - run: composer test:integration
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib

  e2e-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [ integration-tests ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Run E2E tests
        run: |
          # No spec files exist yet under tests/E2E, and this job doesn't
          # stand up a WordPress server for Playwright to hit — see
          # docs/BUILD_STATUS.md, "no real browser/Playwright run ever
          # happened". Skip gracefully rather than failing on
          # infrastructure that hasn't been built, or faking coverage
          # with specs that assert nothing real.
          if ! find tests/E2E -name '*.spec.ts' -print -quit | grep -q .; then
            echo "No E2E specs found under tests/E2E — skipping."
            exit 0
          fi
          npx playwright install --with-deps chromium
          npm run test:e2e
